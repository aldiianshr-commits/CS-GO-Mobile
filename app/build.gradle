plugins {
    id 'com.android.application'
}

def ciVersionCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.aldiianshr.csgo'
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.aldiianshr.csgo"
        minSdk 29
        targetSdk 35
        versionCode ciVersionCode
        versionName "0.1.${ciVersionCode}"
        ndk {
            // Rilis: arm64-v8a (Snapdragon). CI uji asap emulator: -PsmokeAbi=x86_64
            abiFilters(project.hasProperty("smokeAbi") ? project.property("smokeAbi").toString() : "arm64-v8a")
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DANDROID_ARM_NEON=TRUE"
                cppFlags "-std=c++17 -fexceptions -frtti"
            }
        }
    }

    signingConfigs {
        // Kunci debug tetap (disimpan di repo) supaya setiap rilis bisa di-install
        // sebagai update tanpa harus uninstall versi sebelumnya.
        release {
            storeFile file("csgo-release.keystore")
            storePassword "csgomobile"
            keyAlias "csgo"
            keyPassword "csgomobile"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            externalNativeBuild { cmake { arguments "-DCMAKE_BUILD_TYPE=Release" } }
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packaging {
        jniLibs {
            // adrenotools memerlukan .so diekstrak ke nativeLibraryDir (hook Turnip)
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
