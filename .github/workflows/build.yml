name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Uji parser format (host)
        run: |
          cmake -S tests -B build-tests -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-tests -j4
          ./build-tests/format_tests

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang NDK & CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/CSGO-Mobile.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: CSGO-Mobile-apk
          path: dist/CSGO-Mobile.apk

      - name: Laporan build (cabang ci-report)
        if: always()
        run: |
          {
            echo "run: ${GITHUB_RUN_NUMBER} commit: ${GITHUB_SHA}"
            echo "== APK =="; ls -la dist 2>/dev/null
            BT="$ANDROID_HOME/build-tools/35.0.0"
            [ -f dist/CSGO-Mobile.apk ] && "$BT/aapt2" dump badging dist/CSGO-Mobile.apk | head -20
            [ -f dist/CSGO-Mobile.apk ] && unzip -l dist/CSGO-Mobile.apk | grep -E "\.so|classes|\.dex"
            [ -f dist/CSGO-Mobile.apk ] && "$BT/apksigner" verify --print-certs dist/CSGO-Mobile.apk | head -5
            SO=$(find app/build -path "*stripped_native_libs*" -name libcsgo.so | head -1)
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
            [ -n "$SO" ] && echo "== simbol JNI ==" && "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D --defined-only "$SO" | grep Java_ || true
            echo "== peringatan/galat build =="
            grep -nE "warning:|error:|FAILED|BUILD" build.log | grep -v third_party | head -150
            echo "== ekor log =="; tail -60 build.log
          } > ci-report.txt 2>&1 || true
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-report-tmp
          git rm -rq --cached . || true
          git add -f ci-report.txt
          git commit -qm "laporan CI ${GITHUB_RUN_NUMBER}"
          git push -qf origin HEAD:refs/heads/ci-report

      - name: Rilis (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/CSGO-Mobile.apk \
            --title "CS:GO Mobile ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md || \
          gh release upload "${GITHUB_REF_NAME}" dist/CSGO-Mobile.apk --clobber

  emulator-smoke:
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK x86_64 khusus emulator
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          chmod +x gradlew
          ./gradlew --no-daemon -q assembleRelease -PsmokeAbi=x86_64
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/CSGO-Mobile.apk
      - name: Buat folder game uji sintetis
        run: |
          cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build build-tests -j4 > /dev/null
          ./build-tests/format_tests --write-game testgame
      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Uji asap di emulator (x86_64 + terjemahan ARM64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1920x1200
          disable-animations: true
          script: bash tools/smoke_test.sh
      - name: Unggah hasil uji asap (cabang ci-smoke)
        if: always()
        run: |
          mkdir -p smoke
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-smoke-tmp
          git rm -rq --cached . || true
          git add -f smoke
          git commit -qm "uji asap ${GITHUB_RUN_NUMBER}" || true
          git push -qf origin HEAD:refs/heads/ci-smoke
